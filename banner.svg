<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Koveroz — веб-разработчик">
  <style>
    .t,.b{opacity:0;animation:kin 1s cubic-bezier(.2,.8,.2,1) .2s forwards}
    .t{transform:translate(9px,-7px)}
    .b{transform:translate(-9px,7px)}
    @keyframes kin{to{opacity:1;transform:translate(0,0)}}
    .g{stroke-dasharray:9 120;stroke-dashoffset:9;opacity:0;animation:glint 5s ease-in-out 1.3s infinite}
    @keyframes glint{0%{stroke-dashoffset:9;opacity:0}5%{opacity:1}32%{stroke-dashoffset:-70;opacity:1}38%,100%{stroke-dashoffset:-70;opacity:0}}
    .name{font:800 120px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-6px;fill:#fff}
    .sub{font:500 30px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9a9a9a}
    .txt{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d1{animation-delay:.9s}.d2{animation-delay:1.1s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" fill="#000"/>
  <circle cx="200" cy="180" r="170" fill="url(#halo)"/>
  <!-- K traced from the avatar, scaled into a 280px box -->
  <svg x="60" y="40" width="280" height="280" viewBox="30 34 92 82" overflow="visible">
    <path class="t" fill="#fff" d="M39.6 88.5 L40.6 88.4 L45.4 82.5 L49.2 80.0 L71.4 73.4 L82.0 63.1 L92.4 62.8 L112.4 42.0 L85.5 41.9 L60.2 67.8 L59.2 67.0 L59.0 42.1 L47.1 42.0 L39.5 50.4 Z"/>
    <path class="b" fill="#fff" d="M108.6 107.9 L79.0 77.2 L79.2 76.0 L88.6 66.8 L88.4 65.4 L83.6 66.0 L73.1 76.0 L50.1 83.1 L45.1 88.0 L39.6 97.5 L39.5 106.9 L40.4 108.4 L59.0 108.1 L59.4 87.0 L60.4 85.8 L62.2 85.4 L85.8 108.4 L107.9 108.5 Z"/>
    <path class="g" d="M39.6 92.6 L45.2 85.3 L49.6 81.6 L72.2 74.8 L82.8 64.6 L88.6 64.4 L93.5 62.6" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" filter="url(#glow)"/>
  </svg>
  <text class="name txt d1" x="400" y="176">Koveroz</text>
  <text class="sub txt d2" x="404" y="244">Веб-разработчик</text>
  <text class="sub txt d2" x="404" y="286">Сайты для кафе, ресторанов и компаний</text>
</svg>
